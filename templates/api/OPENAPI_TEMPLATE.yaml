openapi: 3.1.0
info:
  title: UASET Standard API Specification
  version: 1.0.0
  description: API contract governing inter-service and client communications.
paths:
  /healthz:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  timestamp:
                    type: string
                    format: date-time
